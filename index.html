<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paddock Car Center — Sistema</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- ===== Pantalla de login ===== -->
  <div id="login-screen" class="login-screen">
    <form id="login-form" class="login-card" autocomplete="off">
      <div class="login-brand">
        <svg class="brand-mark" viewBox="0 0 80 96" aria-hidden="true">
          <rect x="6" y="6" width="26" height="84" fill="#F5A623"/>
          <rect x="12" y="6" width="20" height="84" fill="#1442C8"/>
          <path d="M32 6 H52 a28 28 0 0 1 0 56 H32 Z" fill="#1442C8"/>
          <rect x="32" y="28" width="18" height="10" fill="#F5A623"/>
        </svg>
        <div>
          <div class="brand-name">Paddock</div>
          <div class="brand-sub">Car Center</div>
        </div>
      </div>
      <div class="field">
        <label for="login-user">Usuario</label>
        <input id="login-user" type="text" required autocomplete="username" autocapitalize="none" spellcheck="false">
      </div>
      <div class="field">
        <label for="login-pass">Contraseña</label>
        <input id="login-pass" type="password" required autocomplete="current-password">
      </div>
      <p id="login-error" class="login-error" hidden></p>
      <button type="submit" class="btn btn-primary btn-block" id="login-btn">Entrar</button>
    </form>
  </div>

  <!-- ===== App (oculta hasta loguear) ===== -->
  <div id="app" class="app" hidden>
    <header class="topbar">
      <div class="topbar-brand">
        <svg class="brand-mark sm" viewBox="0 0 80 96" aria-hidden="true">
          <rect x="6" y="6" width="26" height="84" fill="#F5A623"/>
          <rect x="12" y="6" width="20" height="84" fill="#fff"/>
          <path d="M32 6 H52 a28 28 0 0 1 0 56 H32 Z" fill="#fff"/>
          <rect x="32" y="28" width="18" height="10" fill="#F5A623"/>
        </svg>
        <span class="topbar-title">Paddock</span>
      </div>
      <div class="topbar-user">
        <span id="user-label" class="user-label"></span>
        <button id="logout-btn" class="btn btn-ghost btn-sm">Salir</button>
      </div>
    </header>

    <nav class="mainnav" id="mainnav">
      <a href="#/clientes" data-route="clientes">Clientes</a>
      <a href="#/vehiculos" data-route="vehiculos">Vehículos</a>
      <a href="#/taller" data-route="taller">Taller</a>
      <a href="#/cobros" data-route="cobros">Cobros</a>
      <a href="#/repuestos" data-route="repuestos">Repuestos</a>
      <a href="#/ventas" data-route="ventas">Ventas</a>
      <a href="#/caja" data-route="caja">Caja</a>
      <a href="#/comprobantes" data-route="comprobantes">Comprobantes</a>
      <a href="#/proveedores" data-route="proveedores">Proveedores</a>
      <a href="#/compras" data-route="compras">Compras</a>
      <a href="#/usuarios" data-route="usuarios" data-solo-admin>Usuarios</a>
    </nav>

    <main id="view" class="view"></main>
  </div>

  <!-- Contenedor de notificaciones -->
  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <!-- Contenedor de modales -->
  <div id="modal-root"></div>

  <!-- ===== Librerías ===== -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>

  <!-- ===== App (orden importa) ===== -->
  <script src="js/supabase.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/router.js"></script>
  <script src="js/clientes.js"></script>
  <script src="js/vehiculos.js"></script>
  <script src="js/taller.js"></script>
  <script src="js/cobros.js"></script>
  <script src="js/proveedores.js"></script>
  <script src="js/importar.js"></script>
  <script src="js/repuestos.js"></script>
  <script src="js/ventas.js"></script>
  <script src="js/compras.js"></script>
  <script src="js/pagos.js"></script>
  <script src="js/caja.js"></script>
  <script src="js/comprobantes.js"></script>
  <script src="js/reportes.js"></script>
  <script src="js/usuarios.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
